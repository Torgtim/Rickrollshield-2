<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎥 RICKROLL SHIELD - ULTIMATE BILDER</title>
    <style>
        /* ========== STIL ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 5px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .input-section {
            background: #1e293b;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #ff0000;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 3px solid #ff0000;
            background: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1 1 auto;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #475569;
            color: white;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #ff0000, #aa0000);
            color: white;
            border: 2px solid white;
        }
        
        /* ========== VIDEO TYPE BADGE ========== */
        .video-type-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 2px solid #ff0000;
        }
        
        .video-type-badge.shorts {
            background: #ff0000;
            color: white;
        }
        
        .video-type-badge.normal {
            background: #0f172a;
            color: #ff0000;
        }
        
        /* ========== 3 BILDER - PERFEKTE POSISJONER ========== */
        .thumbnail-section {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #ff0000;
        }
        
        .thumbnail-title {
            color: #ff0000;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .thumbnail-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .thumbnail-item {
            text-align: center;
        }
        
        .thumbnail-label {
            color: #ff0000;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .thumbnail-img {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            border: 3px solid #ff0000;
            object-fit: cover;
            background: #1e293b;
            box-shadow: 0 5px 15px rgba(255,0,0,0.3);
        }
        
        /* ========== SHORTS SPESIFIK STYLING ========== */
        .thumbnail-img.shorts-mode {
            aspect-ratio: 9/16;
            max-width: 180px;
            margin: 0 auto;
        }
        
        .thumbnail-gallery.shorts-gallery {
            grid-template-columns: repeat(3, 1fr);
            justify-items: center;
        }
        
        .video-info {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #ff0000;
        }
        
        .video-title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1.3;
        }
        
        .channel-name {
            color: #ff0000;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .safety-badge {
            text-align: center;
            padding: 15px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            border: 3px solid white;
        }
        
        .safety-badge.safe {
            background: #10b981;
        }
        
        .safety-badge.danger {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .view-on-youtube {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            border: 3px solid white;
        }
        
        /* ========== DISKRÉ MINIKNAPP ========== */
        .mini-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        
        .mini-button-container:hover {
            opacity: 1;
        }
        
        .mini-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ff0000;
            border: 3px solid white;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px #ff0000;
        }
        
        .mini-panel {
            position: absolute;
            bottom: 55px;
            right: 0;
            width: 280px;
            background: #1e293b;
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 15px;
            display: none;
            color: white;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .mini-panel.show {
            display: block;
        }
        
        .mini-panel h4 {
            color: #ff0000;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 5px;
        }
        
        .mini-panel p {
            margin: 5px 0;
            padding: 8px;
            background: #0f172a;
            border-radius: 5px;
            border-left: 4px solid #ff0000;
            font-size: 11px;
        }
        
        .mini-panel .success {
            border-left-color: #10b981;
        }
        
        .mini-panel .fail {
            border-left-color: #ef4444;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1e293b;
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-status {
            color: #ff0000;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 RICKROLL SHIELD</h1>
        <div class="subtitle">PERFEKTE BILDER - NORMAL + SHORTS</div>
        
        <div class="input-section">
            <input type="text" id="youtubeUrl" placeholder="Lim inn YouTube-URL (normal eller shorts)">
            <div class="button-group">
                <button class="primary-btn" id="scanBtn">🔍 HENT PERFEKTE BILDER</button>
                <button id="testNormalBtn">🎬 TEST NORMAL</button>
                <button id="testShortsBtn">📱 TEST SHORTS</button>
                <button id="clearBtn">🗑️ TØM</button>
            </div>
        </div>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingMessage">Analyserer video...</p>
            <div class="loading-status" id="loadingStatus"></div>
        </div>
        
        <!-- 3 PERFEKTE BILDER -->
        <div class="thumbnail-section" id="thumbnailSection" style="display: none;">
            <div class="thumbnail-title">
                <span>📸 BILDER FRA VIDEOEN</span>
                <span class="video-type-badge" id="videoTypeBadge">NORMAL</span>
            </div>
            <div class="thumbnail-gallery" id="thumbnailGallery">
                <div class="thumbnail-item">
                    <div class="thumbnail-label">START (0%)</div>
                    <img class="thumbnail-img" id="thumbStart" src="">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">MIDTEN (50%)</div>
                    <img class="thumbnail-img" id="thumbMiddle" src="">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">SLUTT (95%)</div>
                    <img class="thumbnail-img" id="thumbEnd" src="">
                </div>
            </div>
        </div>
        
        <!-- VIDEO INFO -->
        <div class="video-info" id="videoInfo" style="display: none;">
            <div class="video-title" id="videoTitle"></div>
            <div class="channel-name" id="channelName"></div>
            
            <div class="safety-badge" id="safetyBadge">✅ TRYGG</div>
            <a class="view-on-youtube" id="youtubeLink" target="_blank">🎬 SE PÅ YOUTUBE</a>
        </div>
    </div>
    
    <!-- DISKRÉ MINIKNAPP -->
    <div class="mini-button-container">
        <div class="mini-button" id="miniButton">💀</div>
        <div class="mini-panel" id="miniPanel">
            <h4>📊 10💀 STRATEGIER</h4>
            <div id="miniResults"></div>
        </div>
    </div>

    <script>
        // ========== RICKROLL SHIELD - PERFEKTE BILDER ==========
        
        const el = {
            youtubeUrl: document.getElementById('youtubeUrl'),
            scanBtn: document.getElementById('scanBtn'),
            testNormalBtn: document.getElementById('testNormalBtn'),
            testShortsBtn: document.getElementById('testShortsBtn'),
            clearBtn: document.getElementById('clearBtn'),
            loading: document.getElementById('loading'),
            loadingMessage: document.getElementById('loadingMessage'),
            loadingStatus: document.getElementById('loadingStatus'),
            
            thumbnailSection: document.getElementById('thumbnailSection'),
            thumbnailGallery: document.getElementById('thumbnailGallery'),
            videoTypeBadge: document.getElementById('videoTypeBadge'),
            thumbStart: document.getElementById('thumbStart'),
            thumbMiddle: document.getElementById('thumbMiddle'),
            thumbEnd: document.getElementById('thumbEnd'),
            
            videoInfo: document.getElementById('videoInfo'),
            videoTitle: document.getElementById('videoTitle'),
            channelName: document.getElementById('channelName'),
            safetyBadge: document.getElementById('safetyBadge'),
            youtubeLink: document.getElementById('youtubeLink'),
            
            miniButton: document.getElementById('miniButton'),
            miniPanel: document.getElementById('miniPanel'),
            miniResults: document.getElementById('miniResults')
        };
        
        // Array for strategi-resultater
        let strategyResults = [];
        
        // ========== MINIKNAPP ==========
        el.miniButton.addEventListener('click', () => {
            el.miniPanel.classList.toggle('show');
        });
        
        document.addEventListener('click', (e) => {
            if (!el.miniButton.contains(e.target) && !el.miniPanel.contains(e.target)) {
                el.miniPanel.classList.remove('show');
            }
        });
        
        function updateMiniPanel() {
            if (strategyResults.length === 0) {
                el.miniResults.innerHTML = '<p style="color:#666;">Ingen resultater enda</p>';
                return;
            }
            
            let html = '';
            strategyResults.forEach((result, index) => {
                const statusClass = result.success ? 'success' : 'fail';
                const statusIcon = result.success ? '✅' : '❌';
                html += `<p class="${statusClass}"><strong>${index+1}.</strong> ${result.name}: ${statusIcon} ${result.message || ''}</p>`;
            });
            el.miniResults.innerHTML = html;
        }
        
        // ========== HENT VIDEO-ID OG TYPE ==========
        function getVideoInfo(url) {
            if (!url) return { id: null, type: 'unknown' };
            
            // Sjekk om det er shorts
            if (url.includes('/shorts/')) {
                const id = url.split('/shorts/')[1].split('?')[0].split('&')[0];
                return { id, type: 'shorts' };
            }
            
            // youtu.be/
            if (url.includes('youtu.be/')) {
                const id = url.split('youtu.be/')[1].split('?')[0].split('&')[0];
                return { id, type: 'normal' };
            }
            
            // youtube.com/watch?v=
            if (url.includes('v=')) {
                const id = url.split('v=')[1].split('&')[0];
                return { id, type: 'normal' };
            }
            
            return { id: null, type: 'unknown' };
        }
        
        // ========== LAST INN PERFEKTE BILDER ==========
        function loadPerfectThumbnails(videoId, videoType) {
            // Oppdater badge
            el.videoTypeBadge.textContent = videoType === 'shorts' ? 'SHORTS' : 'NORMAL VIDEO';
            el.videoTypeBadge.className = `video-type-badge ${videoType}`;
            
            // FJERN gammel shorts-klasse
            el.thumbStart.classList.remove('shorts-mode');
            el.thumbMiddle.classList.remove('shorts-mode');
            el.thumbEnd.classList.remove('shorts-mode');
            el.thumbnailGallery.classList.remove('shorts-gallery');
            
            if (videoType === 'shorts') {
                // SHORTS - vertikale bilder (9:16)
                el.thumbStart.classList.add('shorts-mode');
                el.thumbMiddle.classList.add('shorts-mode');
                el.thumbEnd.classList.add('shorts-mode');
                el.thumbnailGallery.classList.add('shorts-gallery');
                
                // START (0%) - 1.jpg eller maxresdefault.jpg
                el.thumbStart.src = `https://img.youtube.com/vi/${videoId}/1.jpg`;
                el.thumbStart.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                };
                
                // MIDTEN (50%) - 2.jpg eller 3.jpg
                el.thumbMiddle.src = `https://img.youtube.com/vi/${videoId}/2.jpg`;
                el.thumbMiddle.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/3.jpg`;
                };
                
                // SLUTT (95%) - hqdefault.jpg eller 0.jpg (siste frame for shorts)
                el.thumbEnd.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                el.thumbEnd.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/0.jpg`;
                };
                
            } else {
                // NORMAL VIDEO - vanlige 16:9 bilder
                
                // START (0%) - 1.jpg eller maxresdefault.jpg
                el.thumbStart.src = `https://img.youtube.com/vi/${videoId}/1.jpg`;
                el.thumbStart.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                };
                
                // MIDTEN (50%) - 2.jpg eller 3.jpg
                el.thumbMiddle.src = `https://img.youtube.com/vi/${videoId}/2.jpg`;
                el.thumbMiddle.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/3.jpg`;
                };
                
                // SLUTT (95%) - hqdefault.jpg eller sddefault.jpg (mer nøyaktig slutt)
                el.thumbEnd.src = `https://img.youtube.com/vi/${videoId}/sddefault.jpg`;
                el.thumbEnd.onerror = function() { 
                    this.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                };
            }
            
            // Vis thumbnail-seksjonen
            el.thumbnailSection.style.display = 'block';
        }
        
        // ========== SJEKK RICKROLL ==========
        function checkRickroll(videoId, title, channel) {
            const id = videoId.toLowerCase();
            const titleLower = (title || '').toLowerCase();
            const channelLower = (channel || '').toLowerCase();
            
            // Kjente Rickroll videoer
            const rickrollIds = ['dqw4w9wgxcq', 'ohg5sjyrha0', 'ub82xb1c8os'];
            if (rickrollIds.includes(id)) {
                return { isRickroll: true, reason: '🚨 ORIGINAL RICKROLL!' };
            }
            
            // Sjekk tittel
            if (titleLower.includes('rick astley') || 
                titleLower.includes('never gonna give you up') ||
                titleLower.includes('rickroll') ||
                titleLower.includes('rick roll')) {
                return { isRickroll: true, reason: '🎵 RICKROLL I TITTELEN!' };
            }
            
            // Sjekk kanal
            if (channelLower.includes('rick astley')) {
                return { isRickroll: true, reason: '📺 RICK ASTLEY KANAL!' };
            }
            
            return { isRickroll: false, reason: '✅ TRYGG' };
        }
        
        // ========== 10💀 STRATEGIER ==========
        
        // Strategi 1: oEmbed
        async function strategy1(videoId) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author_name };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 2: Invidious 1
        async function strategy2(videoId) {
            try {
                const response = await fetch(`https://invidious.projectsegfau.lt/api/v1/videos/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 3: Invidious 2
        async function strategy3(videoId) {
            try {
                const response = await fetch(`https://yewtu.be/api/v1/videos/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 4: Invidious 3
        async function strategy4(videoId) {
            try {
                const response = await fetch(`https://inv.riverside.rocks/api/v1/videos/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 5: Piped 1
        async function strategy5(videoId) {
            try {
                const response = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.uploader };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 6: Piped 2
        async function strategy6(videoId) {
            try {
                const response = await fetch(`https://pipedapi.tokhmi.xyz/streams/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.uploader };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 7: Vid.puffyan
        async function strategy7(videoId) {
            try {
                const response = await fetch(`https://vid.puffyan.us/api/v1/videos/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 8: Proxy 1 (allorigins)
        async function strategy8(videoId) {
            try {
                const response = await fetch(`https://api.allorigins.win/raw?url=https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author_name };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 9: Proxy 2 (corsproxy)
        async function strategy9(videoId) {
            try {
                const response = await fetch(`https://corsproxy.io/?https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    return { success: true, title: data.title, channel: data.author_name };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // Strategi 10: Noembed
        async function strategy10(videoId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.title && !data.error) {
                        return { success: true, title: data.title, channel: data.author_name };
                    }
                }
            } catch (e) {}
            return { success: false };
        }
        
        // ========== KJØR ALLE STRATEGIER ==========
        async function runAllStrategies(videoId) {
            strategyResults = [];
            let finalTitle = 'YouTube Video';
            let finalChannel = 'YouTube';
            
            const strategies = [
                { name: 'oEmbed API', func: strategy1 },
                { name: 'Invidious #1', func: strategy2 },
                { name: 'Invidious #2', func: strategy3 },
                { name: 'Invidious #3', func: strategy4 },
                { name: 'Piped #1', func: strategy5 },
                { name: 'Piped #2', func: strategy6 },
                { name: 'Vid.puffyan', func: strategy7 },
                { name: 'Proxy #1', func: strategy8 },
                { name: 'Proxy #2', func: strategy9 },
                { name: 'Noembed', func: strategy10 }
            ];
            
            for (let i = 0; i < strategies.length; i++) {
                const strategy = strategies[i];
                el.loadingStatus.textContent = `Strategi ${i+1}/10: ${strategy.name}...`;
                
                try {
                    const result = await strategy.func(videoId);
                    
                    if (result.success) {
                        strategyResults.push({
                            name: strategy.name,
                            success: true,
                            message: 'OK'
                        });
                        
                        // Oppdater med første vellykkede resultat
                        if (!finalTitle || finalTitle === 'YouTube Video') {
                            finalTitle = result.title || finalTitle;
                            finalChannel = result.channel || finalChannel;
                        }
                    } else {
                        strategyResults.push({
                            name: strategy.name,
                            success: false,
                            message: 'Feilet'
                        });
                    }
                } catch (e) {
                    strategyResults.push({
                        name: strategy.name,
                        success: false,
                        message: 'Feilet'
                    });
                }
                
                updateMiniPanel();
            }
            
            return { title: finalTitle, channel: finalChannel };
        }
        
        // ========== SCAN ==========
        async function scanVideo() {
            const url = el.youtubeUrl.value.trim();
            if (!url) {
                alert('Lim inn en YouTube-URL!');
                return;
            }
            
            const { id: videoId, type: videoType } = getVideoInfo(url);
            if (!videoId) {
                alert('Ugyldig YouTube-URL!');
                return;
            }
            
            // Vis loading
            el.loading.classList.remove('hidden');
            el.thumbnailSection.style.display = 'none';
            el.videoInfo.style.display = 'none';
            strategyResults = [];
            updateMiniPanel();
            
            try {
                // 1. LAST INN PERFEKTE BILDER (med shorts-støtte!)
                loadPerfectThumbnails(videoId, videoType);
                
                // 2. KJØR 10 STRATEGIER (for tittel/kanal)
                const { title, channel } = await runAllStrategies(videoId);
                
                // 3. Oppdater UI
                el.videoTitle.textContent = title;
                el.channelName.textContent = channel;
                el.youtubeLink.href = `https://youtu.be/${videoId}`;
                
                // 4. Sjekk Rickroll
                const rickroll = checkRickroll(videoId, title, channel);
                el.safetyBadge.textContent = rickroll.isRickroll ? `🚨 ${rickroll.reason}` : '✅ TRYGG';
                el.safetyBadge.className = `safety-badge ${rickroll.isRickroll ? 'danger' : 'safe'}`;
                
                // 5. Vis alt
                el.loading.classList.add('hidden');
                el.videoInfo.style.display = 'block';
                
            } catch (error) {
                console.error('Feil:', error);
                el.loading.classList.add('hidden');
                alert('Kunne ikke hente video-data');
            }
        }
        
        // ========== TEST NORMAL ==========
        function testNormal() {
            el.youtubeUrl.value = 'https://youtu.be/dQw4w9WgXcQ';
            scanVideo();
        }
        
        // ========== TEST SHORTS ==========
        function testShorts() {
            el.youtubeUrl.value = 'https://youtube.com/shorts/dQw4w9WgXcQ';
            scanVideo();
        }
        
        // ========== TØM ==========
        function clearAll() {
            el.youtubeUrl.value = '';
            el.thumbnailSection.style.display = 'none';
            el.videoInfo.style.display = 'none';
            strategyResults = [];
            updateMiniPanel();
        }
        
        // ========== EVENT LISTENERS ==========
        el.scanBtn.addEventListener('click', scanVideo);
        el.testNormalBtn.addEventListener('click', testNormal);
        el.testShortsBtn.addEventListener('click', testShorts);
        el.clearBtn.addEventListener('click', clearAll);
        
        el.youtubeUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanVideo();
        });
    </script>
</body>
</html>
