<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎥 RICKROLL SHIELD - 5 STRATEGIER</title>
    <style>
        /* ========== STIL ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 5px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
        }
        
        .input-section {
            background: #1e293b;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #ff0000;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 3px solid #ff0000;
            background: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1 1 auto;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #475569;
            color: white;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #ff0000, #aa0000);
            color: white;
            border: 2px solid white;
        }
        
        .strategy-indicator {
            background: #0f172a;
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            font-size: 12px;
            color: #ff0000;
            border: 1px solid #ff0000;
        }
        
        .youtube-preview {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            border: 3px solid #ff0000;
            display: none;
        }
        
        .thumbnail-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .thumbnail-item {
            text-align: center;
        }
        
        .thumbnail-label {
            color: #ff0000;
            font-size: 11px;
            margin-bottom: 4px;
        }
        
        .thumbnail-img {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            border: 2px solid #ff0000;
            object-fit: cover;
            background: #1e293b;
        }
        
        .video-title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1.3;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .channel-name {
            color: #ff0000;
            font-size: 18px;
            font-weight: bold;
        }
        
        .video-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }
        
        .description-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #ff0000;
            font-size: 14px;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .comments-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .comments-title {
            color: #ff0000;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .comment-item {
            padding: 10px;
            border-bottom: 1px solid #334155;
        }
        
        .comment-author {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        
        .comment-text {
            color: #ddd;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .safety-badge {
            text-align: center;
            padding: 15px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            border: 2px solid white;
        }
        
        .safety-badge.safe {
            background: #10b981;
        }
        
        .safety-badge.danger {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .view-on-youtube {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
            border: 2px solid white;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-status {
            color: #ff0000;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 RICKROLL SHIELD</h1>
        <div class="subtitle">5 FORSKJELLIGE STRATEGIER - KOMMENTARER INKLUDERT</div>
        
        <div class="input-section">
            <input type="text" id="youtubeUrl" placeholder="Lim inn YouTube-URL">
            <div class="button-group">
                <button class="primary-btn" id="scanBtn">🔍 SCAN MED 5 STRATEGIER</button>
                <button id="testBtn">🎲 TEST</button>
                <button id="clearBtn">🗑️ TØM</button>
            </div>
            <div id="strategyDisplay" class="strategy-indicator hidden">Prøver strategi 1/5...</div>
        </div>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingMessage">Forbereder...</p>
            <div class="loading-status" id="loadingStatus"></div>
        </div>
        
        <div class="youtube-preview" id="youtubePreview">
            <div class="thumbnail-gallery">
                <div class="thumbnail-item">
                    <div class="thumbnail-label">START</div>
                    <img class="thumbnail-img" id="thumb0" src="">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">MIDTEN</div>
                    <img class="thumbnail-img" id="thumb1" src="">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">SLUTT</div>
                    <img class="thumbnail-img" id="thumb2" src="">
                </div>
            </div>
            
            <div class="video-title" id="videoTitle"></div>
            
            <div class="channel-info">
                <span class="channel-name" id="channelName"></span>
                <span class="subscribers" id="subscribers">?</span>
            </div>
            
            <div class="video-stats">
                <span class="stat-item" id="views">👁️ ?</span>
                <span class="stat-item" id="likes">❤️ ?</span>
                <span class="stat-item" id="published">📅 ?</span>
                <span class="stat-item" id="duration">⏱️ ?</span>
            </div>
            
            <div class="description-box" id="description">Laster beskrivelse...</div>
            
            <div class="comments-section">
                <div class="comments-title">💬 KOMMENTARER</div>
                <div id="comments"></div>
            </div>
            
            <div class="safety-badge" id="safetyBadge">✅ TRYGG</div>
            <a class="view-on-youtube" id="youtubeLink" target="_blank">🎬 SE PÅ YOUTUBE</a>
        </div>
    </div>

    <script>
        // ========== 5 FORSKJELLIGE STRATEGIER ==========
        
        const el = {
            youtubeUrl: document.getElementById('youtubeUrl'),
            scanBtn: document.getElementById('scanBtn'),
            testBtn: document.getElementById('testBtn'),
            clearBtn: document.getElementById('clearBtn'),
            strategyDisplay: document.getElementById('strategyDisplay'),
            loading: document.getElementById('loading'),
            loadingMessage: document.getElementById('loadingMessage'),
            loadingStatus: document.getElementById('loadingStatus'),
            youtubePreview: document.getElementById('youtubePreview'),
            
            thumb0: document.getElementById('thumb0'),
            thumb1: document.getElementById('thumb1'),
            thumb2: document.getElementById('thumb2'),
            videoTitle: document.getElementById('videoTitle'),
            channelName: document.getElementById('channelName'),
            subscribers: document.getElementById('subscribers'),
            views: document.getElementById('views'),
            likes: document.getElementById('likes'),
            published: document.getElementById('published'),
            duration: document.getElementById('duration'),
            description: document.getElementById('description'),
            comments: document.getElementById('comments'),
            safetyBadge: document.getElementById('safetyBadge'),
            youtubeLink: document.getElementById('youtubeLink')
        };
        
        // ========== HENT VIDEO-ID ==========
        function getVideoId(url) {
            if (!url) return null;
            if (url.includes('youtu.be/')) {
                return url.split('youtu.be/')[1].split('?')[0].split('&')[0];
            }
            if (url.includes('v=')) {
                return url.split('v=')[1].split('&')[0];
            }
            if (url.includes('/shorts/')) {
                return url.split('/shorts/')[1].split('?')[0].split('&')[0];
            }
            if (url.includes('/embed/')) {
                return url.split('/embed/')[1].split('?')[0];
            }
            return null;
        }
        
        // ========== FORMATER TALL ==========
        function formatNumber(num) {
            if (!num) return '?';
            if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num/1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        // ========== FORMATER TID ==========
        function formatDuration(seconds) {
            if (!seconds) return '?';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // ========== STRATEGI 1: oEmbed API ==========
        async function strategy1(videoId) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    return {
                        success: true,
                        title: data.title,
                        channel: data.author_name,
                        thumbnail: data.thumbnail_url
                    };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // ========== STRATEGI 2: Invidious API (flere instanser) ==========
        async function strategy2(videoId) {
            const instances = [
                'https://invidious.projectsegfau.lt',
                'https://yewtu.be',
                'https://inv.riverside.rocks',
                'https://invidious.snopyta.org',
                'https://vid.puffyan.us'
            ];
            
            for (let instance of instances) {
                try {
                    const response = await fetch(`${instance}/api/v1/videos/${videoId}`);
                    if (response.ok) {
                        const data = await response.json();
                        return {
                            success: true,
                            title: data.title,
                            channel: data.author,
                            subscribers: data.authorSubscriberCount,
                            views: data.viewCount,
                            likes: data.likeCount,
                            published: data.publishedText,
                            duration: data.lengthSeconds,
                            description: data.description
                        };
                    }
                } catch (e) {}
            }
            return { success: false };
        }
        
        // ========== STRATEGI 3: Piped API ==========
        async function strategy3(videoId) {
            try {
                const response = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    return {
                        success: true,
                        title: data.title,
                        channel: data.uploader,
                        subscribers: data.uploaderSubscriberCount,
                        views: data.views,
                        likes: data.likes,
                        duration: data.duration,
                        description: data.description
                    };
                }
            } catch (e) {}
            return { success: false };
        }
        
        // ========== STRATEGI 4: YouTube Proxy ==========
        async function strategy4(videoId) {
            // Bruker YouTube's egen oembed med CORS proxy
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://cors-anywhere.herokuapp.com/',
                'https://youtube-proxy.example.com/'
            ];
            
            for (let proxy of proxies) {
                try {
                    const url = `${proxy}https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        return {
                            success: true,
                            title: data.title,
                            channel: data.author_name
                        };
                    }
                } catch (e) {}
            }
            return { success: false };
        }
        
        // ========== STRATEGI 5: Hent kommentarer ==========
        async function strategy5(videoId) {
            const instances = [
                'https://invidious.projectsegfau.lt',
                'https://yewtu.be'
            ];
            
            for (let instance of instances) {
                try {
                    const response = await fetch(`${instance}/api/v1/comments/${videoId}?hmac=true`);
                    if (response.ok) {
                        const data = await response.json();
                        const comments = (data.comments || []).slice(0, 7).map(c => ({
                            author: c.author || 'Ukjent',
                            text: c.content?.text || 'Ingen tekst'
                        }));
                        return {
                            success: true,
                            comments: comments
                        };
                    }
                } catch (e) {}
            }
            return { success: false, comments: [] };
        }
        
        // ========== LAST INN THUMBNAILS ==========
        function loadThumbnails(videoId) {
            // Ulike størrelser = ULIKE bilder!
            el.thumb0.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            el.thumb0.onerror = function() { 
                this.src = `https://img.youtube.com/vi/${videoId}/0.jpg`;
            };
            
            el.thumb1.src = `https://img.youtube.com/vi/${videoId}/sddefault.jpg`;
            el.thumb1.onerror = function() { 
                this.src = `https://img.youtube.com/vi/${videoId}/1.jpg`;
            };
            
            el.thumb2.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            el.thumb2.onerror = function() { 
                this.src = `https://img.youtube.com/vi/${videoId}/2.jpg`;
            };
        }
        
        // ========== SJEKK RICKROLL ==========
        function checkRickroll(videoId, title, channel) {
            const id = videoId.toLowerCase();
            const titleLower = (title || '').toLowerCase();
            const channelLower = (channel || '').toLowerCase();
            
            // Kjente Rickroll videoer
            const rickrollIds = ['dqw4w9wgxcq', 'ohg5sjyrha0', 'ub82xb1c8os', 'dlzxrzfcyos'];
            if (rickrollIds.includes(id)) {
                return { isRickroll: true, reason: '🚨 ORIGINAL RICKROLL!' };
            }
            
            // Sjekk tittel
            if (titleLower.includes('rick astley') || 
                titleLower.includes('never gonna give you up') ||
                titleLower.includes('rickroll') ||
                titleLower.includes('rick roll')) {
                return { isRickroll: true, reason: '🎵 RICKROLL I TITTELEN!' };
            }
            
            // Sjekk kanal
            if (channelLower.includes('rick astley')) {
                return { isRickroll: true, reason: '📺 RICK ASTLEY KANAL!' };
            }
            
            return { isRickroll: false, reason: '✅ INGEN RICKROLL FUNNET' };
        }
        
        // ========== HENT ALLE DATA ==========
        async function fetchAllData(videoId) {
            const result = {
                title: 'YouTube Video',
                channel: 'YouTube',
                subscribers: null,
                views: null,
                likes: null,
                published: null,
                duration: null,
                description: 'Ingen beskrivelse tilgjengelig',
                comments: []
            };
            
            // STRATEGI 1: oEmbed
            el.loadingStatus.textContent = 'Strategi 1/5: oEmbed API...';
            const s1 = await strategy1(videoId);
            if (s1.success) {
                result.title = s1.title;
                result.channel = s1.channel;
            }
            
            // STRATEGI 2: Invidious
            el.loadingStatus.textContent = 'Strategi 2/5: Invidious API...';
            const s2 = await strategy2(videoId);
            if (s2.success) {
                result.title = s2.title || result.title;
                result.channel = s2.channel || result.channel;
                result.subscribers = s2.subscribers;
                result.views = s2.views;
                result.likes = s2.likes;
                result.published = s2.published;
                result.duration = s2.duration;
                result.description = s2.description || result.description;
            }
            
            // STRATEGI 3: Piped
            el.loadingStatus.textContent = 'Strategi 3/5: Piped API...';
            const s3 = await strategy3(videoId);
            if (s3.success && !s2.success) { // Bare bruk hvis strategi 2 feilet
                result.title = s3.title || result.title;
                result.channel = s3.channel || result.channel;
                result.subscribers = s3.subscribers;
                result.views = s3.views;
                result.likes = s3.likes;
                result.duration = s3.duration;
                result.description = s3.description || result.description;
            }
            
            // STRATEGI 4: Proxy
            el.loadingStatus.textContent = 'Strategi 4/5: Proxy API...';
            const s4 = await strategy4(videoId);
            if (s4.success && !s2.success && !s3.success) {
                result.title = s4.title || result.title;
                result.channel = s4.channel || result.channel;
            }
            
            // STRATEGI 5: Kommentarer
            el.loadingStatus.textContent = 'Strategi 5/5: Henter kommentarer...';
            const s5 = await strategy5(videoId);
            if (s5.success) {
                result.comments = s5.comments;
            }
            
            return result;
        }
        
        // ========== OPPDATER UI ==========
        function updateUI(data, videoId) {
            el.videoTitle.textContent = data.title;
            el.channelName.textContent = data.channel;
            el.subscribers.textContent = data.subscribers ? `${formatNumber(data.subscribers)} abonnenter` : '?';
            
            el.views.innerHTML = `👁️ ${data.views ? formatNumber(data.views) : '?'}`;
            el.likes.innerHTML = `❤️ ${data.likes ? formatNumber(data.likes) : '?'}`;
            el.published.innerHTML = `📅 ${data.published || '?'}`;
            el.duration.innerHTML = `⏱️ ${data.duration ? formatDuration(data.duration) : '?'}`;
            
            el.description.textContent = data.description || 'Ingen beskrivelse tilgjengelig';
            
            // Kommentarer
            if (data.comments && data.comments.length > 0) {
                el.comments.innerHTML = data.comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-author">${c.author}</div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `).join('');
            } else {
                el.comments.innerHTML = '<div style="color:#666; padding:15px; text-align:center;">Ingen kommentarer funnet</div>';
            }
            
            // Rickroll-sjekk
            const rickroll = checkRickroll(videoId, data.title, data.channel);
            el.safetyBadge.textContent = rickroll.isRickroll ? `🚨 ${rickroll.reason}` : '✅ TRYGG VIDEO';
            el.safetyBadge.className = `safety-badge ${rickroll.isRickroll ? 'danger' : 'safe'}`;
            
            el.youtubeLink.href = `https://youtu.be/${videoId}`;
        }
        
        // ========== SCAN ==========
        async function scanVideo() {
            const url = el.youtubeUrl.value.trim();
            if (!url) {
                alert('Lim inn en YouTube-URL!');
                return;
            }
            
            const videoId = getVideoId(url);
            if (!videoId) {
                alert('Ugyldig YouTube-URL!');
                return;
            }
            
            // Vis loading
            el.loading.classList.remove('hidden');
            el.strategyDisplay.classList.remove('hidden');
            el.youtubePreview.style.display = 'none';
            el.loadingMessage.textContent = 'Starter 5 strategier...';
            
            try {
                // Last inn thumbnails (ALLTID!)
                loadThumbnails(videoId);
                
                // Hent alle data
                const data = await fetchAllData(videoId);
                
                // Oppdater UI
                updateUI(data, videoId);
                
                // Ferdig!
                el.loading.classList.add('hidden');
                el.strategyDisplay.classList.add('hidden');
                el.youtubePreview.style.display = 'block';
                
            } catch (error) {
                console.error('Feil:', error);
                el.loading.classList.add('hidden');
                el.strategyDisplay.classList.add('hidden');
                alert('Kunne ikke hente video-data. Prøv igjen.');
            }
        }
        
        // ========== TEST ==========
        function testVideo() {
            el.youtubeUrl.value = 'https://youtu.be/dQw4w9WgXcQ';
            scanVideo();
        }
        
        // ========== TØM ==========
        function clearAll() {
            el.youtubeUrl.value = '';
            el.youtubePreview.style.display = 'none';
        }
        
        // ========== EVENT LISTENERS ==========
        el.scanBtn.addEventListener('click', scanVideo);
        el.testBtn.addEventListener('click', testVideo);
        el.clearBtn.addEventListener('click', clearAll);
        
        el.youtubeUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanVideo();
        });
    </script>
</body>
</html>
