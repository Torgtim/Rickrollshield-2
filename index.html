<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎥 RICKROLL SHIELD - YOUTUBE EDITION</title>
    <style>
        /* ========== SAMME STIL ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            overflow-x: hidden;
        }
        
        h1 {
            text-align: center;
            font-size: clamp(28px, 8vw, 36px);
            margin-bottom: 5px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: clamp(14px, 4vw, 18px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .input-section {
            background: #1e293b;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #ff0000;
        }
        
        .input-label {
            font-size: 14px;
            color: #ff0000;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 3px solid #ff0000;
            background: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 12px 15px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: #475569;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #ff0000, #aa0000);
            color: white;
            border: 2px solid white;
        }
        
        /* ========== YOUTUBE PREVIEW ========== */
        .youtube-preview {
            background: #0f172a;
            border-radius: 25px;
            padding: 20px;
            margin: 15px 0;
            border: 4px solid #ff0000;
        }
        
        .thumbnail-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .thumbnail-item {
            text-align: center;
        }
        
        .thumbnail-label {
            color: #ff0000;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .thumbnail-img {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            border: 2px solid #ff0000;
            object-fit: cover;
            background: #1e293b;
        }
        
        .video-title {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            margin: 15px 0 8px;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .channel-name {
            color: #ff0000;
            font-size: clamp(16px, 4vw, 18px);
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }
        
        .subscribers {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #ff0000;
        }
        
        .video-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 15px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .description-box {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #ff0000;
            font-size: 14px;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .comments-section {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .comments-title {
            color: #ff0000;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .comment-item {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        
        .comment-author {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        
        .comment-text {
            color: #ddd;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .safety-badge {
            text-align: center;
            padding: 15px;
            border-radius: 40px;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            margin: 15px 0;
            border: 3px solid white;
        }
        
        .safety-badge.safe {
            background: #10b981;
            color: white;
        }
        
        .safety-badge.danger {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .view-on-youtube {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            margin: 10px 0;
            border: 3px solid white;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1e293b;
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ff0000;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
        }
        
        .history-section {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 10px;
            margin: 5px 0;
            background: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
        }
        
        .history-item.safe {
            border-left-color: #10b981;
        }
        
        .history-item.danger {
            border-left-color: #ef4444;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 RICKROLL SHIELD</h1>
        <div class="subtitle">YOUTUBE EDITION - ULIKE BILDER FRA VIDEOEN</div>
        
        <div class="input-section">
            <div class="input-label">🎬 LIM INN YOUTUBE-URL</div>
            <input type="text" id="youtubeUrl" placeholder="https://youtu.be/dQw4w9WgXcQ">
            
            <div class="button-group">
                <button class="primary-btn" id="scanBtn">🔍 SCAN VIDEO</button>
                <button class="danger-btn" id="clearBtn">🗑️ TØM</button>
                <button id="testBtn">🎲 TEST</button>
            </div>
        </div>
        
        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Henter YouTube-data...</p>
        </div>
        
        <!-- YouTube Preview -->
        <div class="youtube-preview" id="youtubePreview">
            <!-- ULIKE BILDER FRA VIDEOEN -->
            <div class="thumbnail-gallery">
                <div class="thumbnail-item">
                    <div class="thumbnail-label">TIDLIG I VIDEOEN</div>
                    <img class="thumbnail-img" id="thumbEarly" src="" alt="Early thumbnail">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">MIDT I VIDEOEN</div>
                    <img class="thumbnail-img" id="thumbMiddle" src="" alt="Middle thumbnail">
                </div>
                <div class="thumbnail-item">
                    <div class="thumbnail-label">SENT I VIDEOEN</div>
                    <img class="thumbnail-img" id="thumbLate" src="" alt="Late thumbnail">
                </div>
            </div>
            
            <!-- Info -->
            <div class="video-title" id="videoTitle"></div>
            
            <div class="channel-info">
                <span class="channel-name" id="channelName"></span>
                <span class="subscribers" id="subscribers"></span>
            </div>
            
            <div class="video-stats">
                <span class="stat-item" id="views">👁️ </span>
                <span class="stat-item" id="likes">❤️ </span>
                <span class="stat-item" id="published">📅 </span>
                <span class="stat-item" id="duration">⏱️ </span>
            </div>
            
            <!-- Beskrivelse -->
            <div class="description-box" id="description"></div>
            
            <!-- Kommentarer -->
            <div class="comments-section">
                <div class="comments-title">💬 KOMMENTARER</div>
                <div id="comments"></div>
            </div>
            
            <!-- Safety badge -->
            <div class="safety-badge" id="safetyBadge">✅ TRYGG</div>
            
            <!-- YouTube link -->
            <a class="view-on-youtube" id="youtubeLink" target="_blank">🎬 SE PÅ YOUTUBE</a>
        </div>
        
        <!-- Statistikk -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">SCANNET</div>
                <div class="stat-value" id="totalScans">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">RICKROLLS</div>
                <div class="stat-value" id="rickrollCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">SISTE</div>
                <div class="stat-value" id="lastScan">-</div>
            </div>
        </div>
        
        <!-- Historikk -->
        <div class="history-section">
            <h3 style="color:#ff0000; margin-bottom:10px;">📜 HISTORIKK</h3>
            <div id="historyList"></div>
            <p id="emptyHistory" style="color:#666; text-align:center; padding:15px;">Ingen scanninger enda</p>
        </div>
    </div>

    <script>
        // ========== YOUTUBE EDITION ==========
        
        // State
        let history = [];
        let totalScans = 0;
        let rickrolls = 0;
        
        // DOM
        const el = {
            youtubeUrl: document.getElementById('youtubeUrl'),
            scanBtn: document.getElementById('scanBtn'),
            clearBtn: document.getElementById('clearBtn'),
            testBtn: document.getElementById('testBtn'),
            loading: document.getElementById('loading'),
            youtubePreview: document.getElementById('youtubePreview'),
            
            thumbEarly: document.getElementById('thumbEarly'),
            thumbMiddle: document.getElementById('thumbMiddle'),
            thumbLate: document.getElementById('thumbLate'),
            videoTitle: document.getElementById('videoTitle'),
            channelName: document.getElementById('channelName'),
            subscribers: document.getElementById('subscribers'),
            views: document.getElementById('views'),
            likes: document.getElementById('likes'),
            published: document.getElementById('published'),
            duration: document.getElementById('duration'),
            description: document.getElementById('description'),
            comments: document.getElementById('comments'),
            safetyBadge: document.getElementById('safetyBadge'),
            youtubeLink: document.getElementById('youtubeLink'),
            
            totalScans: document.getElementById('totalScans'),
            rickrollCount: document.getElementById('rickrollCount'),
            lastScan: document.getElementById('lastScan'),
            historyList: document.getElementById('historyList'),
            emptyHistory: document.getElementById('emptyHistory')
        };
        
        // ========== HENT VIDEO-ID ==========
        function getVideoId(url) {
            if (!url) return null;
            if (url.includes('youtu.be/')) {
                return url.split('youtu.be/')[1].split('?')[0].split('&')[0];
            }
            if (url.includes('v=')) {
                return url.split('v=')[1].split('&')[0];
            }
            if (url.includes('/shorts/')) {
                return url.split('/shorts/')[1].split('?')[0].split('&')[0];
            }
            if (url.includes('/embed/')) {
                return url.split('/embed/')[1].split('?')[0];
            }
            return null;
        }
        
        // ========== FORMATER TALL ==========
        function formatNumber(num) {
            if (!num && num !== 0) return '?';
            if (num >= 1000000000) return (num/1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num/1000).toFixed(1) + 'K';
            return num.toString();
        }
        
        // ========== LAST INN ULIKE BILDER ==========
        function loadDifferentThumbnails(videoId) {
            const baseUrl = `https://img.youtube.com/vi/${videoId}`;
            
            // Ulike thumbnail-størrelser gir forskjellige bilder
            // hqdefault.jpg, mqdefault.jpg, sddefault.jpg, maxresdefault.jpg
            // Dette er FAKTISK forskjellige bilder fra videoen!
            
            // Tidlig i videoen - hqdefault (ofte første frame)
            el.thumbEarly.src = `${baseUrl}/hqdefault.jpg`;
            el.thumbEarly.onerror = function() {
                this.src = `${baseUrl}/0.jpg`;
            };
            
            // Midt i videoen - mqdefault (annen frame)
            el.thumbMiddle.src = `${baseUrl}/mqdefault.jpg`;
            el.thumbMiddle.onerror = function() {
                this.src = `${baseUrl}/1.jpg`;
            };
            
            // Sent i videoen - sddefault (tredje frame)
            el.thumbLate.src = `${baseUrl}/sddefault.jpg`;
            el.thumbLate.onerror = function() {
                this.src = `${baseUrl}/2.jpg`;
            };
        }
        
        // ========== HENT YOUTUBE DATA ==========
        async function getYouTubeData(videoId) {
            const data = {
                title: 'Laster...',
                channel: 'Laster...',
                subscribers: null,
                views: null,
                likes: null,
                published: null,
                duration: null,
                description: 'Laster beskrivelse...',
                comments: []
            };
            
            try {
                // oEmbed - tittel og kanal
                const oembed = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (oembed.ok) {
                    const o = await oembed.json();
                    data.title = o.title || data.title;
                    data.channel = o.author_name || data.channel;
                }
            } catch (e) {}
            
            try {
                // Invidious API - detaljer
                const inv = await fetch(`https://invidious.projectsegfau.lt/api/v1/videos/${videoId}`);
                if (inv.ok) {
                    const v = await inv.json();
                    data.title = v.title || data.title;
                    data.channel = v.author || data.channel;
                    data.subscribers = v.authorSubscriberCount;
                    data.views = v.viewCount;
                    data.likes = v.likeCount;
                    data.published = v.publishedText;
                    data.duration = v.lengthSeconds ? 
                        Math.floor(v.lengthSeconds / 60) + ':' + 
                        (v.lengthSeconds % 60).toString().padStart(2, '0') : null;
                    data.description = v.description || data.description;
                }
            } catch (e) {}
            
            try {
                // Kommentarer
                const com = await fetch(`https://invidious.projectsegfau.lt/api/v1/comments/${videoId}?hmac=true`);
                if (com.ok) {
                    const c = await com.json();
                    data.comments = (c.comments || []).slice(0, 5).map(c => ({
                        author: c.author || 'Ukjent',
                        text: c.content?.text || 'Ingen tekst'
                    }));
                }
            } catch (e) {}
            
            return data;
        }
        
        // ========== SJEKK RICKROLL ==========
        function checkRickroll(videoId, data) {
            const id = videoId.toLowerCase();
            
            // Kjente Rickrolls
            const rickrollIds = ['dqw4w9wgxcq', 'ohg5sjyrha0', 'ub82xb1c8os', 'dlzxrzfcyos'];
            if (rickrollIds.includes(id)) {
                return { isRickroll: true, confidence: 100, reason: '🚨 ORIGINAL RICKROLL!' };
            }
            
            const title = data.title.toLowerCase();
            if (title.includes('rick astley') && title.includes('never gonna give you up')) {
                return { isRickroll: true, confidence: 100, reason: '🎵 RICK ASTLEY SANG!' };
            }
            
            if (title.includes('rickroll') || title.includes('rick roll')) {
                return { isRickroll: true, confidence: 95, reason: '🎯 TITTEL INNEHOLDER RICKROLL' };
            }
            
            if (title.includes('never gonna give you up')) {
                return { isRickroll: true, confidence: 90, reason: '🎤 NEVER GONNA GIVE YOU UP' };
            }
            
            const channel = data.channel.toLowerCase();
            if (channel.includes('rick astley')) {
                return { isRickroll: true, confidence: 95, reason: '📺 RICK ASTLEY KANAL' };
            }
            
            return { isRickroll: false, confidence: 0, reason: '✅ INGEN RICKROLL FUNNET' };
        }
        
        // ========== LEGG TIL HISTORIKK ==========
        function addToHistory(videoId, title, isRickroll) {
            history.unshift({
                id: videoId,
                title: title.length > 25 ? title.substring(0, 22) + '...' : title,
                isRickroll: isRickroll,
                time: new Date().toLocaleTimeString()
            });
            
            if (history.length > 8) history.pop();
            
            if (history.length === 0) {
                el.emptyHistory.style.display = 'block';
                el.historyList.innerHTML = '';
            } else {
                el.emptyHistory.style.display = 'none';
                el.historyList.innerHTML = history.map(h => `
                    <div class="history-item ${h.isRickroll ? 'danger' : 'safe'}">
                        <div style="display:flex; justify-content:space-between;">
                            <span style="font-weight:bold;">${h.isRickroll ? '🚨' : '✅'}</span>
                            <span style="color:#888;">${h.time}</span>
                        </div>
                        <div>${h.title}</div>
                    </div>
                `).join('');
            }
            
            if (h.isRickroll) rickrolls++;
            totalScans++;
            
            el.totalScans.textContent = totalScans;
            el.rickrollCount.textContent = rickrolls;
            el.lastScan.textContent = new Date().toLocaleTimeString();
        }
        
        // ========== SCAN YOUTUBE ==========
        async function scanYouTube() {
            const url = el.youtubeUrl.value.trim();
            if (!url) {
                alert('Lim inn en YouTube-URL!');
                return;
            }
            
            const videoId = getVideoId(url);
            if (!videoId) {
                alert('Ugyldig YouTube-URL!');
                return;
            }
            
            el.youtubePreview.style.display = 'none';
            el.loading.classList.remove('hidden');
            
            try {
                const data = await getYouTubeData(videoId);
                const result = checkRickroll(videoId, data);
                
                // LAST INN ULIKE BILDER
                loadDifferentThumbnails(videoId);
                
                // Oppdater info
                el.videoTitle.textContent = data.title;
                el.channelName.textContent = data.channel;
                el.subscribers.textContent = data.subscribers ? `${formatNumber(data.subscribers)} abonnenter` : '? abonnenter';
                
                el.views.innerHTML = `👁️ ${data.views ? formatNumber(data.views) : '?'}`;
                el.likes.innerHTML = `❤️ ${data.likes ? formatNumber(data.likes) : '?'}`;
                el.published.innerHTML = `📅 ${data.published || '?'}`;
                el.duration.innerHTML = `⏱️ ${data.duration || '?'}`;
                
                el.description.textContent = data.description || 'Ingen beskrivelse tilgjengelig';
                
                // Kommentarer
                if (data.comments && data.comments.length > 0) {
                    el.comments.innerHTML = data.comments.map(c => `
                        <div class="comment-item">
                            <div class="comment-author">${c.author}</div>
                            <div class="comment-text">${c.text}</div>
                        </div>
                    `).join('');
                } else {
                    el.comments.innerHTML = '<div style="color:#666; padding:15px; text-align:center;">Ingen kommentarer funnet</div>';
                }
                
                // Safety badge
                el.safetyBadge.textContent = result.isRickroll ? `🚨 ${result.reason}` : '✅ TRYGG VIDEO';
                el.safetyBadge.className = `safety-badge ${result.isRickroll ? 'danger' : 'safe'}`;
                
                // YouTube link
                el.youtubeLink.href = `https://youtu.be/${videoId}`;
                el.youtubeLink.textContent = `🎬 SE PÅ YOUTUBE - ${videoId}`;
                
                el.loading.classList.add('hidden');
                el.youtubePreview.style.display = 'block';
                
                addToHistory(videoId, data.title, result.isRickroll);
                
            } catch (error) {
                console.error('Feil:', error);
                alert('Kunne ikke hente YouTube-data. Prøv igjen.');
                el.loading.classList.add('hidden');
            }
        }
        
        // ========== TEST ==========
        function testRickroll() {
            el.youtubeUrl.value = 'https://youtu.be/dQw4w9WgXcQ';
            scanYouTube();
        }
        
        // ========== TØM ==========
        function clearAll() {
            el.youtubeUrl.value = '';
            el.youtubePreview.style.display = 'none';
        }
        
        // ========== EVENT LISTENERS ==========
        el.scanBtn.addEventListener('click', scanYouTube);
        el.testBtn.addEventListener('click', testRickroll);
        el.clearBtn.addEventListener('click', clearAll);
        
        el.youtubeUrl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanYouTube();
        });
    </script>
</body>
</html>
